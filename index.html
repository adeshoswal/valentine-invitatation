<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <div class="card">
      <h1>Will you be my Valentine?</h1>
      <p class="sub">I picked you — will you be mine?</p>

      <div class="buttons" id="buttons">
        <button id="yesBtn" class="btn yes">Yes 💖</button>
        <button id="noBtn" class="btn no" aria-label="No">No 💔</button>
      </div>

      <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
          <h2>Yay! 💖</h2>
          <p>I'm so happy! Thank you 😊</p>
          <button id="closeModal" class="btn">Close</button>
        </div>
      </div>
    </div>

    <footer class="credits">
      Tip: try clicking the "Yes" button — the "No" button doesn't like being chosen.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
